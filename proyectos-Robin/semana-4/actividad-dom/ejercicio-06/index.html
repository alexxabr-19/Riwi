<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body class="bg-light">
    <h1 class="text-center mt-4 mb-3 text-danger"> Calculadora IMC </h1>
    <div class="container">
        <div class="mb-3">
            <label for="peso" class="form-label">Ingrese su peso: </label>
            <input type="number" class="form-control" id="peso" aria-describedby="emailHelp">
            <div id="emailHelp" class="form-text">En kilogramos, porfi.</div>
        </div>
        <div class="mb-3">
            <label for="estatura" class="form-label">Ingrese su estatura: </label>
            <input type="number" class="form-control" id="estatura">
            <div id="emailHelp" class="form-text">En metros, porfi.</div>
        </div>
        <button class="btn btn-primary" id="boton">Calcular IMC</button>
        <p id="resultado"></p>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>

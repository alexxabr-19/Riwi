<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body class="bg-dark">
    <h1 class="text-center mt-4 mb-3 text-light"> Semáforo</h1>
    <div class="container border border-3 border-dark rounded p-3 w-20 mx-auto">
        <div class="boton d-flex justify-content-center">
            <button type="button" class="btn btn-circle opacity-25 bg-danger" id="Srojo"> </button>
            <p class="text-light ms-4 mt-3"></p>
        </div>
        <div class="boton mt-2 d-flex justify-content-center">
            <button type="button" class="btn btn-circle bg-warning opacity-25" id="Samarillo"> </button>
            <p class="text-light ms-4 mt-3"></p>

        </div>
        <div class="boton mt-2 d-flex justify-content-center">
            <button type="button" class="btn btn-circle bg-success opacity-25" id="Sverde"> </button>
            <p class="text-light ms-4 mt-3"></p>

        </div>

        <div class="botones mt-5 d-flex justify-content-center">
            <button type="button" class="btn btn-danger" id="bRojo">Rojo</button>
            <button type="button" class="btn btn-warning ms-3" id="bAmarillo">Amarillo</button>
            <button type="button" class="btn btn-success ms-3" id="bVerde">Verde</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>

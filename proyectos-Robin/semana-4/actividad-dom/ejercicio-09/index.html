<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body class="bg-light">
    <h1 class="text-center mt-4 mb-3 text-primary"> Tarjeta de perfil en vivo </h1>
    <div class="container border border-3 border-dark rounded p-3 w-20 mx-auto">
        <div class="mb-3">
            <input type="text" class="form-control" id="inputNombre" aria-describedby="emailHelp"
                placeholder="Escribe tu nombre: ">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" id="inputProfesion" aria-describedby="emailHelp"
                placeholder="Escribe tu profesión: ">
        </div>
        <div class="mb-3">
            <input type="url" class="form-control" id="url" aria-describedby="emailHelp"
                placeholder="Escribe la URL de tu foto: ">
        </div>
        <div class="tarjeta">
            <div class="card" style="width: 18rem;">
                <img src="https://cba.ucb.edu.bo/blog/wp-content/uploads/2021/04/desarrollo-programadores-desarrollo-tecnologias-diseno-codificacion-sitios-web_18497-1019.jpg" class="card-img-top" alt="profesión">
                <div class="card-body">
                    <h5 id="nombre">Tu nombre</h5>
                    <p class="card-text" id="profesion">Tu profesión.</p>
                </div>
            </div>
        </div>

        </ul>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="./js/app.js"></script>
</body>

</html>
